baseURL = 'https://nanumlearn.org/'
locale = 'en-us'
title = 'Nanum Learn'

enableRobotsTXT = true
buildFuture = true
disableKinds = ["taxonomy"]

[outputs]
  home = ["html", "rss", "threads"]

[outputFormats.threads]
  mediaType = "application/json"
  baseName = "comment-threads"
  isPlainText = true
  notAlternative = true

[params]
author = "Enoch Yu"
favicon = "/img/favicon/favicon.ico"
  [params.social]
    youtube = "https://www.youtube.com/@NanumLearn"
    discord = "https://discord.gg/6ABSqUf63"
    github = "https://github.com/NanumLearn"
  [params.comments]
    api = "https://nanumlearn.org/api/comments"
    site = "nanumlearn"
    turnstile = "0x4AAAAAAFsYp2Nsr1n9RUic"

[security]
  allowContent = ['^text/html$', '^text/markdown$']


